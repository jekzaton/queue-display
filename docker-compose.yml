services:
  queue-db:
    image: mysql:8.4
    container_name: yth-queue-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: yth_queue
      MYSQL_USER: queue_user
      MYSQL_PASSWORD: queue_password_change_me
      TZ: Asia/Bangkok
    ports:
      - "3307:3306"
    volumes:
      - queue_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uqueue_user",
          "-pqueue_password_change_me",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  queue_mysql_data:
